---
before_script:
    - apt-get update
    - apt-get install -y cmake cmake-data curl libncurses-dev libvterm-dev doxygen graphviz tmux valgrind

include:
    - template: SAST.gitlab-ci.yml

format:
  image: quay.io/lib/gcc:latest
  stage: build

  before_script:
    - apt-get update
    - apt-get install -y clang-format
  script:
    - make check_format

build:
    image: quay.io/lib/gcc:latest
    stage: build

    script:
        - git submodule init
        - git submodule update
        - rm -rf build
        - mkdir build
        - cd build
        - cmake .. -DCMAKE_BUILD_TYPE:String=Release -DBUILD_TESTING:Bool=OFF
        - cmake --build .

semgrep-sast:
  before_script:
    - "true"

build_test:
    image: quay.io/lib/gcc:latest
    stage: test

    script:
        - git submodule init
        - git submodule update
        - rm -rf build_test
        - mkdir build_test
        - cd build_test
        - cmake .. -DCMAKE_BUILD_TYPE:String=Debug -DTEST_COVERAGE:Bool=ON
        - cmake --build .
        - ../run_in_tmux.sh ctest --schedule-random
        - cmake --build . --target coverage

    after_script:
        - apt-get install -y gcovr
        - gcovr --xml-pretty -o coverage.xml --root . --gcov-ignore-parse-errors --print-summary

    artifacts:
      name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
      expire_in: 365 days
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage.xml

memcheck:
    image: quay.io/lib/gcc:latest
    stage: test
    when: manual
    script:
        - git submodule init
        - git submodule update
        - rm -rf leak_test
        - mkdir leak_test
        - cd leak_test
        - cmake ../ -DCMAKE_BUILD_TYPE:String=Debug -DUSE_INTERNAL_NCURSES_BUILD:Bool=ON
        - cmake --build .
        - cmake .
        - cmake --build .
        - ../run_in_tmux.sh ctest --schedule-random -L memcheck -D ExperimentalMemCheck
        - cat Testing/Temporary/MemoryChecker.*.log
        - '[ $(cat Testing/Temporary/MemoryChecker.*.log | wc -l) == "0" ]'

coverity-image:
    image:
        name: quay.io/podman/stable:latest
    stage: build
    when: manual
    before_script:
        - 'true'
    script:
        - podman build "${CI_PROJECT_DIR}/.coverity"
          --file "${CI_PROJECT_DIR}/.coverity/Dockerfile"
          --build-arg "COVERITY_TOKEN=${COVERITY_TOKEN}"
          --tag "registry.gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/coverity:latest"
        - podman push "registry.gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/coverity:latest"

coverity:
    image: registry.gitlab.com/bracketttc/ncpty/coverity:latest
    stage: test

    script:
        - rm -rf build
        - mkdir build
        - cd build
        - cmake .. -DCMAKE_BUILD_TYPE:String=Release -DBUILD_TESTING:Bool=OFF
        - cov-build --dir cov-int make
        - tar -jcf ncpty.tbz cov-int

    after_script:
        - cd build
        - curl --form token=${COVERITY_TOKEN} --form email=brackett.tc@gmail.com --form file=@ncpty.tbz --form version=$(grep CMAKE_PROJECT_VERSION:STATIC  -r | cut -d = -f 2 | tail -n 1)-$(git rev-parse --short=8 HEAD) --form description="" https://scan.coverity.com/builds?project=bracketttc%2Fncpty
